services:
  web:
    build: .
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-before-demo}
      DATABASE_URL: sqlite:////app/data/vulnshop.db
      SESSION_COOKIE_SECURE: "true"
    volumes:
      - app-data:/app/data
      - app-uploads:/app/static/uploads
    expose:
      - "5000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  app-data:
  app-uploads:
