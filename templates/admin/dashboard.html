{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Admin Dashboard</h1>
  <p>Restricted administrative area for managing users, products, and orders.</p>
  <p>Total Users: {{ users }}</p>
  <p>Total Products: {{ products }}</p>
  <p>Total Orders: {{ orders }}</p>
  <p>
    <a href="{{ url_for('admin.manage_users') }}">Manage Users</a> |
    <a href="{{ url_for('admin.manage_products') }}">Manage Products</a> |
    <a href="{{ url_for('admin.manage_orders') }}">Manage Orders</a>
  </p>
</div>
{% endblock %}
